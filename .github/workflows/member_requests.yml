name: Member Report Requests

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# There must be only one getUpdates consumer for this bot.
concurrency:
  group: telegram-member-requests-${{ github.repository }}
  cancel-in-progress: false

jobs:
  respond:
    if: vars.BOT_ENABLED != 'false' && vars.MEMBER_REQUESTS_ENABLED != 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core requirements
        run: python -m pip install -r requirements.txt
      - name: Find the latest public report snapshot from the default branch
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          artifact_info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=daily-report&per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id) | [.id, .workflow_run.id, .workflow_run.head_branch] | @tsv' \
            | awk -v branch="$DEFAULT_BRANCH" '$3 == branch && !found {print $1, $2; found=1}')
          echo "artifact_id=${artifact_info%% *}" >> "$GITHUB_OUTPUT"
          echo "run_id=${artifact_info#* }" >> "$GITHUB_OUTPUT"
      - name: Download the report content
        if: steps.snapshot.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.snapshot.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.snapshot.outputs.run_id }}
          merge-multiple: true
          path: report-cache
      - name: Handle pending Telegram requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MEMBERSHIP_CHANNEL_ID: ${{ vars.MEMBERSHIP_CHANNEL_ID || '@sentencedIntoMusic' }}
          CHANNEL_JOIN_URL: ${{ secrets.CHANNEL_JOIN_URL || vars.CHANNEL_JOIN_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tehran' }}
        run: python -m src.member_bot --report report-cache/daily-report.json --listen-seconds 240
