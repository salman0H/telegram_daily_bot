name: Daily Telegram Report Bot

on:
  schedule:
    - cron: '30 3 * * *' # 07:00 Asia/Tehran (UTC+03:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview in Actions logs without sending to Telegram'
        type: boolean
        default: false
  repository_dispatch:
    types: [daily-report]
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: daily-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and run offline regression tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

  execute-bot:
    if: vars.BOT_ENABLED != 'false' && !(github.event_name == 'schedule' && vars.DAILY_EXTERNAL_SCHEDULER == 'true') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    # Both workflows share the encrypted state. Never run two writers/consumers.
    concurrency:
      group: telegram-member-state-${{ github.repository }}
      cancel-in-progress: false
    env:
      ENABLE_AUDIO_DOWNLOAD: ${{ vars.ENABLE_AUDIO_DOWNLOAD || 'false' }}
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core requirements
        run: python -m pip install -r requirements.txt
      - name: Install optional audio dependencies
        if: env.ENABLE_AUDIO_DOWNLOAD == 'true' && env.DRY_RUN != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-audio.txt
      - name: Generate daily report
        id: report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          ENABLE_VOCABULARY: ${{ vars.ENABLE_VOCABULARY || 'true' }}
          ENABLE_VOCABULARY_DICTIONARY: ${{ vars.ENABLE_VOCABULARY_DICTIONARY || 'true' }}
          VOCABULARY_PER_DAY: ${{ vars.VOCABULARY_PER_DAY || '5' }}
          ENABLE_PERSIAN_CALENDAR: ${{ vars.ENABLE_PERSIAN_CALENDAR || 'true' }}
          ENABLE_PERSIAN_POETRY: ${{ vars.ENABLE_PERSIAN_POETRY || 'true' }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          ENABLE_NASA: ${{ vars.ENABLE_NASA || 'true' }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPORTRADAR_SOCCER_API_KEY: ${{ secrets.SPORTRADAR_SOCCER_API_KEY }}
          SPORTRADAR_BASKETBALL_API_KEY: ${{ secrets.SPORTRADAR_BASKETBALL_API_KEY }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tehran' }}
          CITY_NAME: ${{ vars.CITY_NAME || 'مشهد' }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT || '36.2605' }}
          WEATHER_LON: ${{ vars.WEATHER_LON || '59.6168' }}
          NEWS_MAX_AGE_HOURS: ${{ vars.NEWS_MAX_AGE_HOURS || '36' }}
          NEWS_PER_CATEGORY: ${{ vars.NEWS_PER_CATEGORY || '2' }}
          ENABLE_HACKER_NEWS: ${{ vars.ENABLE_HACKER_NEWS || 'true' }}
          HACKER_NEWS_PER_DAY: ${{ vars.HACKER_NEWS_PER_DAY || '3' }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS || 'openai/gpt-oss-120b,llama-3.3-70b-versatile' }}
        run: |
          python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print("Actual start (Tehran):", datetime.now(ZoneInfo("Asia/Tehran")).isoformat(), "| Scheduled target: 07:00")'
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main --dry-run --export-report report-cache/daily-report.json
          else
            python -m src.main --export-report report-cache/daily-report.json
          fi
      - name: Restore encrypted subscriptions
        id: subscribers
        if: always() && env.DRY_RUN != 'true' && vars.DAILY_SUBSCRIPTIONS_ENABLED != 'false' && hashFiles('report-cache/daily-report.json') != ''
        uses: ./.github/actions/restore-subscribers
      - name: Deliver to subscribed channel members
        if: always() && env.DRY_RUN != 'true' && vars.DAILY_SUBSCRIPTIONS_ENABLED != 'false' && steps.subscribers.outcome == 'success' && hashFiles('report-cache/daily-report.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          SUBSCRIBER_STATE_KEY: ${{ secrets.SUBSCRIBER_STATE_KEY }}
          MEMBERSHIP_CHANNEL_ID: ${{ vars.MEMBERSHIP_CHANNEL_ID || '@sentencedIntoMusic' }}
          CHANNEL_JOIN_URL: ${{ secrets.CHANNEL_JOIN_URL || vars.CHANNEL_JOIN_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tehran' }}
          DESTINATION_SERVED: ${{ steps.report.outcome == 'success' }}
        run: |
          args=()
          if [ "$DESTINATION_SERVED" = 'true' ]; then args+=(--destination-already-served); fi
          python -m src.member_bot --report report-cache/daily-report.json --state subscriber-cache/subscribers.enc --save-state subscriber-output/subscribers.enc --broadcast "${args[@]}"
      - name: Retain encrypted subscription changes
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subscribers-v1
          path: subscriber-output/subscribers.enc
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish public report snapshot for member requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report-cache/daily-report.json
          retention-days: 2
          if-no-files-found: ignore
